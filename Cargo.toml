[package]
name = "opencode-bill"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generate a bill for an OpenCode session"

[package.metadata]
section = "Utilities"

[package.metadata.deb]
maintainer = "Julian Kahlert <90937526+juliankahlert@users.noreply.github.com>"
copyright = "2026, Julian Kahlert"
extended-description = "Generates a plain-text bill summarizing usage and cost for an OpenCode AI coding session."
revision = "1"
section = "utils"
priority = "optional"
depends = []
assets = [
    ["target/release/opencode-bill", "usr/bin/opencode-bill", "755"],
]

[package.metadata.generate-rpm]
name = "opencode-bill"
release = "1"
license = "MIT"
summary = "Generate a bill for OpenCode sessions"
vendor = "Julian Kahlert"
url = "https://github.com/juliankahlert/opencode-bill"
auto-req = "disabled"
require-sh = false

[[package.metadata.generate-rpm.assets]]
source = "target/release/opencode-bill"
dest = "/usr/bin/opencode-bill"
mode = "755"

[profile.release]
# Aggressive size optimization for the release binary.
opt-level = "z"        # optimize for size
lto = "fat"            # fat LTO across all crates
codegen-units = 1      # single codegen unit maximizes LTO benefit
strip = true           # strip symbols and debug info
panic = "abort"        # no unwind tables or panic runtime
# debug defaults to off in release; kept explicit for clarity
debug = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.33"
ratatui = "0.30.2"
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rust_decimal = { version = "1.42.1", default-features = false, features = ["std"] }
rusty-money = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
